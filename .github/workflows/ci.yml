name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # prisma.config.ts resolves these even for `generate`; the tests use Testcontainers instead.
  DATABASE_URL: postgresql://slotlock:slotlock@localhost:5432/slotlock
  REDIS_URL: redis://localhost:6379/0

jobs:
  check:
    name: Biome, tsc, Prisma, Vitest (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm prisma validate
      - run: pnpm test -- --coverage
